[package]
name = "hyperx-mic-lite"
version = "1.2.1-SNAPSHOT"
edition = "2024"

[dependencies]
cpal = "0.18.1"
eframe = { version = "0.35.0", features = ["glow"] }
# `macos-shared-device` stops macOS from opening HID interfaces exclusively: the button
# listener and the lighting writer each hold their own handle to the same interface. Each
# backend feature is inert on the other platform.
hidapi = { version = "2.6.6", default-features = false, features = [
    "windows-native",
    "macos-shared-device",
] }
rfd = "0.15"
rumqttc = { version = "0.25.1", features = ["url", "websocket"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_EventLog",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell_PropertiesSystem"
] }
# Required in addition to `windows`: the `#[implement]` macro expands to `windows_core::`
# paths, which only resolve when the crate is a direct dependency.
windows-core = "0.62.2"
windows-service = "0.8.1"
winreg = "0.56.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
# Already in the tree through cpal; used directly for the device controls cpal does not wrap.
objc2-core-audio = { version = "0.3.2", default-features = false, features = [
    "std",
    "AudioHardware",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFDictionary",
    "CFString",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSData",
    "NSError",
    "NSString",
    "NSValue",
] }
# Lighting reports go to a USB interface macOS does not publish as HID; see lighting_port.
objc2-io-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "usb",
    "AppleUSBDefinitions",
] }
objc2-io-usb-host = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-io-kit",
    "IOUSBHostDefinitions",
    "IOUSBHostInterface",
    "IOUSBHostObject",
] }
tray-icon = { version = "0.26.1", default-features = false }
